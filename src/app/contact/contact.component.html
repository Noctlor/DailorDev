  <!-- Success Message -->
  <div *ngIf="showSuccess" class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg flex items-center">
    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
    </svg>
    <span>¡Mensaje enviado correctamente! Te responderé pronto.</span>
  </div>

  <!-- Error Message -->
  <div *ngIf="showError" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg flex items-center">
    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
    </svg>
    <span>{{ errorMessage }}</span>
  </div>

  <!-- Contact Form -->
  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Name Field -->
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700">Name *</label>
      <input 
        type="text" 
        id="name" 
        formControlName="name" 
        class="mt-1 block w-full rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [ngClass]="{'border-red-500 bg-red-50': isFieldInvalid('name'), 'border-gray-300': !isFieldInvalid('name')}"
        placeholder="Tu nombre">
      <p *ngIf="isFieldInvalid('name')" class="mt-1 text-sm text-red-600">
        {{ getFieldError('name') }}
      </p>
    </div>

    <!-- Email Field -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email *</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        class="mt-1 block w-full rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [ngClass]="{'border-red-500 bg-red-50': isFieldInvalid('email'), 'border-gray-300': !isFieldInvalid('email')}"
        placeholder="tu@email.com">
      <p *ngIf="isFieldInvalid('email')" class="mt-1 text-sm text-red-600">
        {{ getFieldError('email') }}
      </p>
    </div>

    <!-- Message Field -->
    <div>
      <label for="message" class="block text-sm font-medium text-gray-700">Your message *</label>
     <textarea 
        id="message" 
        formControlName="message" 
        rows="4" 
        class="mt-1 block w-full rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        [ngClass]="{'border-red-500 bg-red-50': isFieldInvalid('message'), 'border-gray-300': !isFieldInvalid('message')}"
        placeholder="Escribe tu mensaje aquí..."></textarea>
      <p *ngIf="isFieldInvalid('message')" class="mt-1 text-sm text-red-600"> 
        {{ getFieldError('message') }}
      </p>
    </div>

    <!-- Submit Button -->
    <div class="flex justify-center">
      <button 
        type="submit" 
        [disabled]="isLoading"
        class="px-6 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-300 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
        
        <!-- Loading Spinner -->
        <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        
        {{ isLoading ? 'Enviando...' : 'Send message' }}
      </button>
    </div>
  </form>
    </div>
